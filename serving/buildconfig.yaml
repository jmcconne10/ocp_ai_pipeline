apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: char-completion-serving
  labels:
    app: char-completion-serving
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: char-completion-serving
  labels:
    app: char-completion-serving
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: char-completion-serving:latest
