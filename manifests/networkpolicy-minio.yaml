apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-redhat-ods-app-to-minio
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ods-applications
      podSelector:
        matchLabels:
          app.kubernetes.io/name: data-science-pipelines-operator
    ports:
    - port: 9000
      protocol: TCP
  podSelector:
    matchLabels:
      app: minio-dspa
  policyTypes:
  - Ingress
